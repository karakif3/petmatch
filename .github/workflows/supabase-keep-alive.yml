name: Supabase keep-alive

# Ücretsiz planda Supabase projesi ~7 gün istek almazsa duraklatılıyor
# (2026-10 başında petmatch bu yüzden INACTIVE'e düştü ve uygulama hiç
# açılmadı). Bu iş iki günde bir GERÇEK bir veritabanı sorgusu atar.
#
# Kalıcı çözüm DEĞİL: Pro plan duraklatmayı tamamen kaldırır. Ayrıca
# GitHub, 60 gün commit almayan public repolarda zamanlanmış işleri
# kapatır — o durumda Actions sekmesinden yeniden etkinleştirilmeli.
#
# Gereken secret'lar: SUPABASE_URL, SUPABASE_ANON_KEY (anon key istemci
# bundle'ında zaten açık; gizli değil, yine de repoda düz yazılmıyor).

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Veritabanına sorgu at
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/regions?select=slug&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "REST yanıtı: $status"
          # Duraklamışsa iş kırmızı düşer → GitHub e-posta ile haber verir.
          test "$status" = "200"
