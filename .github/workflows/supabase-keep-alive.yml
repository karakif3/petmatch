name: Supabase keep-alive

# Ücretsiz planda Supabase, "yeterli kullanıcı veritabanı aktivitesi" görmeyen
# projeyi 7 günde duraklatıyor; dokümana göre "genelde her gün birkaç kullanıcı
# isteği" yetiyor (supabase.com/docs/guides/platform/free-project-pausing).
#
# Geçmiş: 2026-10-03'te iki günde bir anon OKUMA kuruldu; ping'ler başarılı
# olduğu halde 2026-10-10'da duraklatma uyarısı geldi. Artık günde 3 kez
# gerçek bir YAZMA (keep_alive RPC: INSERT + DELETE) ve bir okuma yapılıyor.
#
# Kalıcı çözüm DEĞİL: Pro plan duraklatmayı tamamen kaldırır. Ayrıca
# GitHub, 60 gün commit almayan repolarda zamanlanmış işleri kapatır —
# o durumda Actions sekmesinden yeniden etkinleştirilmeli.
#
# Gereken secret'lar: SUPABASE_URL, SUPABASE_ANON_KEY,
# SUPABASE_KEEPALIVE_TOKEN (özeti ops_settings'te; değiştirirsen ikisini birden).

on:
  schedule:
    - cron: "23 2,10,18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Kalpatışı yaz
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEEPALIVE_TOKEN: ${{ secrets.SUPABASE_KEEPALIVE_TOKEN }}
        run: |
          body=$(jq -n --arg t "$KEEPALIVE_TOKEN" '{p_token: $t}')
          response=$(curl -s -w "\n%{http_code}" --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "$body")
          status=$(echo "$response" | tail -n1)
          echo "RPC yanıtı: $status $(echo "$response" | sed '$d')"
          # Duraklamışsa ya da token uyuşmazsa iş kırmızı düşer → GitHub e-posta atar.
          test "$status" = "200"

      - name: Okuma isteği
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/regions?select=slug&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "REST yanıtı: $status"
          test "$status" = "200"
